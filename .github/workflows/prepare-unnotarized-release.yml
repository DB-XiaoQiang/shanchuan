name: 准备未公证发行的签名更新源
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且基础附件齐全的预发布草稿（vX.Y.Z）
        required: true
        type: string
      ci_run_id:
        description: 同一提交已经全部成功的 main 主 CI run id
        required: true
        type: string
      mac_zip_sha256:
        description: 本机稳定签名 Mac ZIP 的 SHA-256
        required: true
        type: string
      mac_dmg_sha256:
        description: 本机稳定签名 Mac DMG 的 SHA-256
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: prepare-unnotarized-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      MAC_ZIP_SHA256: ${{ inputs.mac_zip_sha256 }}
      MAC_DMG_SHA256: ${{ inputs.mac_dmg_sha256 }}
    steps:
      - name: 解析可信主 CI 提交
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['CI_RUN_ID']
          if repo != 'DB-XiaoQiang/shanchuan' or not re.fullmatch(r'[1-9][0-9]{0,18}', run_id):
              raise SystemExit('仓库或 CI run id 无效。')
          run = json.loads(subprocess.run(['gh', 'api', '--method', 'GET', f'repos/{repo}/actions/runs/{run_id}'],
                                         capture_output=True, check=True).stdout)
          sha = run.get('head_sha', '')
          if not (re.fullmatch(r'[0-9a-f]{40}', sha) and run.get('status') == 'completed'
                  and run.get('conclusion') == 'success' and run.get('head_branch') == 'main'
                  and run.get('path') == '.github/workflows/ci.yml'
                  and run.get('event') in {'push', 'workflow_dispatch'}
                  and run.get('repository', {}).get('full_name') == repo
                  and run.get('head_repository', {}).get('full_name') == repo):
              raise SystemExit('只能检出同仓库成功 main 主 CI 的提交。')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: 准备固定版本 Sparkle 工具（不提供更新私钥）
        run: swift package resolve
      - name: 验证未公证包并准备双重签名更新源（不发布）
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
        run: |
          python3 scripts/prepare-unnotarized-release.py \
            --tag "$RELEASE_TAG" --ci-run-id "$CI_RUN_ID" \
            --mac-zip-sha256 "$MAC_ZIP_SHA256" --mac-dmg-sha256 "$MAC_DMG_SHA256" \
            --report "$RUNNER_TEMP/unnotarized-release-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: unnotarized-release-verification
          path: ${{ runner.temp }}/unnotarized-release-verification.json
          if-no-files-found: error
